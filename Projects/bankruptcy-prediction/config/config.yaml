# ==========================================================
# Central Pipeline Configuration
# Bankruptcy Risk Intelligence System
# ==========================================================
#
# Purpose
# -------
# This file defines all configuration parameters used
# across the machine learning pipeline.
#
# Using a configuration file instead of hardcoding values
# makes the system:
#
# • flexible
# • reproducible
# • easy to maintain
# • production-ready
#
# Pipeline Architecture
# ---------------------
#
# Raw Data
#     ↓
# Data Ingestion
#     ↓
# Data Validation
#     ↓
# Data Transformation
#     ↓
# Model Training
#     ↓
# Model Evaluation
#
# Each pipeline stage reads its configuration from this file.


# ==========================================================
# 1️⃣ DATA INGESTION CONFIGURATION
# ==========================================================
#
# Controls how the dataset is loaded and split into
# training and testing datasets.
#
data_ingestion:

  # Path to the raw bankruptcy dataset
  data_path: data/raw/bankruptcy-prevention.xlsx

  # Directory where ingestion artifacts will be stored
  root_dir: artifacts/data_ingestion

  # Output path for training dataset
  train_file_path: artifacts/data_ingestion/train.csv

  # Output path for testing dataset
  test_file_path: artifacts/data_ingestion/test.csv

  # Fraction of dataset reserved for testing
  test_size: 0.2

  # Random seed to ensure reproducible splits
  random_state: 42


# ==========================================================
# 2️⃣ DATA VALIDATION CONFIGURATION
# ==========================================================
#
# Controls schema validation and dataset integrity checks.
#
data_validation:

  # Directory for validation artifacts
  root_dir: artifacts/data_validation

  # File where validation results will be stored
  status_file_path: artifacts/data_validation/status.txt


# ==========================================================
# 3️⃣ DATA TRANSFORMATION CONFIGURATION
# ==========================================================
#
# Controls feature preparation before model training.
#
data_transformation:

  # Directory where transformation outputs will be stored
  root_dir: artifacts/data_transformation

  # Transformed training feature dataset
  transformed_train_path: artifacts/data_transformation/X_train.csv

  # Transformed testing feature dataset
  transformed_test_path: artifacts/data_transformation/X_test.csv

  # Transformed training labels
  transformed_y_train_path: artifacts/data_transformation/y_train.csv

  # Transformed testing labels
  transformed_y_test_path: artifacts/data_transformation/y_test.csv


# ==========================================================
# 4️⃣ MODEL TRAINER CONFIGURATION
# ==========================================================
#
# Controls model training, hyperparameter tuning,
# and experiment tracking.
#
model_trainer:

  # Directory where trained model and metrics will be stored
  root_dir: artifacts/model_trainer

  # File path for saving the best trained model
  trained_model_path: artifacts/model_trainer/model.pkl


  # ------------------------------------------------------
  # MLflow Experiment Tracking
  # ------------------------------------------------------
  #
  # MLflow tracks:
  # • model experiments
  # • hyperparameters
  # • evaluation metrics
  # • model artifacts
  #
  mlflow_tracking_uri: "sqlite:///mlflow.db"

  mlflow_experiment_name: "Bankruptcy_Prediction"


  # ------------------------------------------------------
  # Hyperparameter Search Space
  # ------------------------------------------------------
  #
  # Defines hyperparameter grids used by GridSearchCV
  # during model training.
  #
  param_grids:


    # --------------------------------------------------
    # Logistic Regression
    # --------------------------------------------------
    logistic_regression:

      model: LogisticRegression

      params:

        # Regularization strength
        model__C: [0.01, 0.1, 1, 10]


    # --------------------------------------------------
    # Random Forest
    # --------------------------------------------------
    random_forest:

      model: RandomForestClassifier

      params:

        # Number of trees
        model__n_estimators: [100, 200]

        # Maximum depth of trees
        model__max_depth: [null, 5, 10]


    # --------------------------------------------------
    # Support Vector Machine
    # --------------------------------------------------
    svm:

      model: SVC

      params:

        model__C: [0.1, 1, 10]

        model__kernel: ["linear", "rbf"]

        model__gamma: ["scale", "auto"]


    # --------------------------------------------------
    # K-Nearest Neighbors
    # --------------------------------------------------
    knn:

      model: KNeighborsClassifier

      params:

        model__n_neighbors: [3, 5, 7]


    # --------------------------------------------------
    # Gradient Boosting
    # --------------------------------------------------
    gradient_boosting:

      model: GradientBoostingClassifier

      params:

        model__n_estimators: [100, 200]

        model__learning_rate: [0.01, 0.1]


# ==========================================================
# 5️⃣ MODEL EVALUATION CONFIGURATION              ← NEW
# ==========================================================
#
# Controls where evaluation artifacts are written.
#
# Previously this stage had no config section — the
# artifact directory was hardcoded inside the component
# as the string "artifacts/model_evaluation", which
# breaks in Docker and CI environments where the working
# directory is not the project root.
#
model_evaluation:

  # Directory where all evaluation artifacts are stored
  root_dir: artifacts/model_evaluation

  # Full scalar metrics (accuracy, AUC, F1, MCC, etc.)
  metrics_file_path: artifacts/model_evaluation/evaluation_metrics.json

  # Full classification report (per-class precision/recall/F1)
  report_file_path: artifacts/model_evaluation/evaluation_report.txt

  # Confusion matrix as JSON (TN/FP/FN/TP)
  confusion_matrix_path: artifacts/model_evaluation/confusion_matrix.json